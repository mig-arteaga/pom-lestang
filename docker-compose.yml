services:
  web:
    build: .
    container_name: pom-lestang-web
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: pom_lestang
      DB_USER: pom_user
      DB_PASS: pom_password
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: pom-lestang-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: pom_lestang
      MYSQL_USER: pom_user
      MYSQL_PASSWORD: pom_password
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pom-lestang-pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: pom_user
      PMA_PASSWORD: pom_password
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
